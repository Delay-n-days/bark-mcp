name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build
      # 产物必须能在最低支持版本上跑
      - run: npx --yes node@20 dist/bark-mcp.js --version
